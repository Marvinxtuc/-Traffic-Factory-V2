<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="PAGE_TITLE.CONTENT"></title>
  <link rel="stylesheet" href="/web/assets/ui.css" />
</head>
<body class="tf-body">
  <div class="tf-app-shell">
    <aside class="tf-sidebar" data-region="sidebar">
      <div class="tf-brand">
        <h1 class="tf-brand-title" data-i18n="BRAND.ENTERPRISE"></h1>
        <p class="tf-brand-subtitle" data-i18n="BRAND.VERSION"></p>
      </div>
      <nav class="tf-nav" data-region="navigation">
        <a class="tf-nav-link" href="/web/discovery" data-i18n="NAV.DISCOVERY"></a>
        <a class="tf-nav-link" href="/web/topics" data-i18n="NAV.TOPICS"></a>
        <a class="tf-nav-link is-active" href="/web/content" data-i18n="NAV.CONTENT"></a>
        <span class="tf-nav-link tf-muted" data-i18n="NAV.IMAGE_LAB"></span>
        <span class="tf-nav-link tf-muted" data-i18n="NAV.QUALITY_GATE"></span>
        <span class="tf-nav-link tf-muted" data-i18n="NAV.RETROSPECTIVE"></span>
      </nav>
      <div class="tf-nav-tail">
        <span class="tf-nav-link tf-muted" data-i18n="NAV.HELP_CENTER"></span>
        <span class="tf-nav-link tf-muted" data-i18n="NAV.ACCOUNT"></span>
      </div>
    </aside>

    <div class="tf-main">
      <header class="tf-topbar" data-region="header">
        <h2 class="tf-topbar-title-sm" data-i18n="BRAND.PRODUCT"></h2>
        <span class="tf-topbar-note" data-i18n="CONTENT.TOP_NOTE"></span>
      </header>

      <main class="tf-workspace" data-page="content">
        <section id="content-input-association" class="tf-panel" data-slot="input-association">
          <div class="tf-panel-body">
            <div class="tf-content-summary">
              <h4 class="tf-section-title" style="color: var(--tf-primary);" data-i18n="MODULE.SOURCE_TOPIC_SUMMARY"></h4>
              <div class="tf-summary-grid">
                <div>
                  <h3 id="summary-title" style="margin: 0 0 8px; font-size: 30px; line-height: 1.25;"></h3>
                  <p id="summary-text" class="tf-muted" style="margin: 0; font-size: 16px;"></p>
                </div>
                <div class="tf-card" style="padding: 10px;">
                  <dl class="tf-kv" style="grid-template-columns: 86px minmax(0, 1fr);">
                    <dt data-i18n="FIELD.TOPIC_ID"></dt><dd id="summary-topic-id">-</dd>
                    <dt data-i18n="FIELD.TARGET_PLATFORM"></dt><dd data-i18n="COMMON.PLATFORM_WECHAT"></dd>
                    <dt data-i18n="FIELD.STATUS"></dt><dd id="summary-topic-status">-</dd>
                  </dl>
                </div>
              </div>
            </div>

            <div class="tf-tabbar" style="margin-top: 12px;">
              <span class="tf-tab is-active" data-i18n="CONTENT.TAB_WECHAT"></span>
            </div>

            <div class="tf-content-layout">
              <div>
                <div class="tf-editor">
                  <div class="tf-editor-toolbar">
                    <div class="tf-toolbar">
                      <button class="tf-button is-secondary" type="button" disabled data-i18n="ACTION.POLISH"></button>
                    </div>
                    <div class="tf-toolbar">
                      <button id="regenerate-toolbar" class="tf-button is-secondary" type="button" data-i18n="ACTION.REGENERATE"></button>
                    </div>
                  </div>
                  <div class="tf-editor-body">
                    <article class="tf-prose">
                      <h3 id="preview-headline"></h3>
                      <p id="preview-paragraph-1"></p>
                      <p id="preview-paragraph-2"></p>
                      <div class="tf-ai-insight">
                        <h4 class="tf-section-title" style="color: var(--tf-tertiary); margin-bottom: 6px;" data-i18n="MODULE.SMART_INSIGHT"></h4>
                        <p id="preview-insight" style="margin: 0; font-size: 13px; color: #5c2f10;"></p>
                      </div>
                    </article>
                  </div>
                </div>

                <div id="generate-error-tip" class="tf-error-tip is-hidden" style="margin-top: 10px;">
                  <div>
                    <strong id="error-tip-title"></strong>
                    <div id="error-tip-desc" style="font-size: 12px;"></div>
                  </div>
                  <button id="retry-error-tip" class="tf-button is-danger" type="button" data-i18n="ACTION.REGENERATE"></button>
                </div>
              </div>

              <aside class="tf-meta-panel">
                <label class="tf-field">
                  <span class="tf-label" data-i18n="FIELD.TOPIC_SELECT"></span>
                  <select id="topic-select" class="tf-select"></select>
                </label>

                <label class="tf-field">
                  <span class="tf-label" data-i18n="FIELD.TOPIC_ID"></span>
                  <input id="topic-id" class="tf-input" data-i18n-placeholder="CONTENT.TOPIC_ID_PLACEHOLDER" />
                </label>

                <label class="tf-field">
                  <span class="tf-label" data-i18n="FIELD.CONTENT_TYPE"></span>
                  <input id="content-type" class="tf-input" />
                </label>

                <label class="tf-field">
                  <span class="tf-label" data-i18n="FIELD.INPUT_PAYLOAD_JSON"></span>
                  <textarea id="input-payload" class="tf-textarea" rows="8" data-i18n-placeholder="CONTENT.INPUT_PAYLOAD_PLACEHOLDER"></textarea>
                </label>

                <div class="tf-meta-footer">
                  <div class="tf-button-row">
                    <button id="content-generate" class="tf-button is-primary" type="button" data-i18n="ACTION.GENERATE"></button>
                    <button id="content-clear" class="tf-button is-secondary" type="button" data-i18n="ACTION.CLEAR"></button>
                  </div>
                </div>
              </aside>
            </div>
          </div>
        </section>

        <section id="content-output" class="tf-panel" data-slot="output">
          <div class="tf-panel-head">
            <div>
              <h3 class="tf-panel-title" data-i18n="MODULE.GENERATE_OUTPUT"></h3>
              <p class="tf-panel-desc" data-i18n="CONTENT.OUTPUT_DESC"></p>
            </div>
            <div id="output-job-status">-</div>
          </div>
          <div class="tf-panel-body">
            <div id="output-state" class="tf-state-host"></div>
            <pre id="result-box" class="tf-json">{}</pre>
          </div>
        </section>

        <section id="content-versions" class="tf-panel" data-slot="versions">
          <div class="tf-panel-head">
            <div>
              <h3 class="tf-panel-title" data-i18n="MODULE.VERSION_RECORDS"></h3>
              <p class="tf-panel-desc" data-i18n="CONTENT.VERSIONS_DESC"></p>
            </div>
          </div>
          <div class="tf-panel-body">
            <div id="versions-state" class="tf-state-host"></div>
            <div id="versions-table-wrap" class="tf-table-wrap is-hidden">
              <table class="tf-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th data-i18n="FIELD.TOPIC_ID"></th>
                    <th data-i18n="FIELD.CONTENT_TYPE"></th>
                    <th data-i18n="FIELD.CREATED_AT"></th>
                    <th data-i18n="FIELD.TITLE"></th>
                    <th data-i18n="ACTION.VIEW_DETAIL"></th>
                  </tr>
                </thead>
                <tbody id="version-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/web/assets/i18n_zh.js"></script>
  <script src="/web/assets/ui.js"></script>
  <script>
    TFUI.applyI18n(document);

    const refs = {
      topicSelect: document.getElementById('topic-select'),
      topicId: document.getElementById('topic-id'),
      contentType: document.getElementById('content-type'),
      inputPayload: document.getElementById('input-payload'),
      contentGenerate: document.getElementById('content-generate'),
      contentClear: document.getElementById('content-clear'),
      regenerateToolbar: document.getElementById('regenerate-toolbar'),
      retryErrorTip: document.getElementById('retry-error-tip'),
      generateErrorTip: document.getElementById('generate-error-tip'),
      errorTipTitle: document.getElementById('error-tip-title'),
      errorTipDesc: document.getElementById('error-tip-desc'),
      summaryTitle: document.getElementById('summary-title'),
      summaryText: document.getElementById('summary-text'),
      summaryTopicId: document.getElementById('summary-topic-id'),
      summaryTopicStatus: document.getElementById('summary-topic-status'),
      previewHeadline: document.getElementById('preview-headline'),
      previewParagraph1: document.getElementById('preview-paragraph-1'),
      previewParagraph2: document.getElementById('preview-paragraph-2'),
      previewInsight: document.getElementById('preview-insight'),
      outputJobStatus: document.getElementById('output-job-status'),
      outputState: document.getElementById('output-state'),
      resultBox: document.getElementById('result-box'),
      versionsState: document.getElementById('versions-state'),
      versionsTableWrap: document.getElementById('versions-table-wrap'),
      versionBody: document.getElementById('version-body'),
    };

    const t = TFUI.t;
    const formatTemplate = TFUI.formatTemplate;

    let topics = [];
    let selectedTopicId = null;
    let versions = [];
    let lastGenerateInput = null;

    const queryTopicIdRaw = new URLSearchParams(window.location.search).get('topic_id');
    const queryTopicId = queryTopicIdRaw ? Number(queryTopicIdRaw) : null;

    function currentTopic() {
      return topics.find((item) => item.id === selectedTopicId) || null;
    }

    function setResult(payload) {
      refs.resultBox.textContent = TFUI.prettyJSON(payload || {});
    }

    function setErrorTip(visible, title, desc) {
      refs.generateErrorTip.classList.toggle('is-hidden', !visible);
      refs.errorTipTitle.textContent = title || t('CONTENT.ERROR_TIP_TITLE');
      refs.errorTipDesc.textContent = desc || t('CONTENT.ERROR_TIP_DESC');
    }

    function setOutputStatus(status) {
      if (!status) {
        refs.outputJobStatus.textContent = t('COMMON.NONE');
        return;
      }
      refs.outputJobStatus.innerHTML = TFUI.statusBadgeHtml(status, 'job');
    }

    function updateSummary(topic) {
      if (!topic) {
        refs.summaryTitle.textContent = t('CONTENT.SUMMARY_WAIT_TITLE');
        refs.summaryText.textContent = t('CONTENT.SUMMARY_WAIT_DESC');
        refs.summaryTopicId.textContent = t('COMMON.NONE');
        refs.summaryTopicStatus.textContent = t('COMMON.NONE');
        return;
      }

      refs.summaryTitle.textContent = topic.topic_title || t('CONTENT.SUMMARY_WAIT_TITLE');
      refs.summaryText.textContent = topic.angle || t('TOPICS.ANGLE_EMPTY');
      refs.summaryTopicId.textContent = String(topic.id);
      refs.summaryTopicStatus.innerHTML = TFUI.statusBadgeHtml(topic.status || 'pending', 'topic');
    }

    function updatePreview(result, topic) {
      if (!result) {
        refs.previewHeadline.textContent = t('CONTENT.PREVIEW_WAIT_TITLE');
        refs.previewParagraph1.textContent = t('CONTENT.PREVIEW_WAIT_DESC');
        refs.previewParagraph2.textContent = '';
        refs.previewInsight.textContent = t('CONTENT.INSIGHT_DEFAULT');
        return;
      }

      refs.previewHeadline.textContent = result.headline || (topic && topic.topic_title) || t('CONTENT.PREVIEW_NO_TITLE');
      refs.previewParagraph1.textContent = result.draft || t('CONTENT.PREVIEW_NO_DRAFT');
      refs.previewParagraph2.textContent = Array.isArray(result.structure)
        ? formatTemplate(t('CONTENT.PREVIEW_STRUCTURE_TEMPLATE'), { items: result.structure.join(' / ') })
        : '';
      refs.previewInsight.textContent = topic && topic.angle
        ? formatTemplate(t('CONTENT.INSIGHT_ANGLE_TEMPLATE'), { angle: topic.angle })
        : t('TOPICS.ANGLE_EMPTY');
    }

    function normalizeContentType(rawType) {
      const safe = String(rawType || '').trim().toLowerCase();
      if (!safe || safe === t('CONTENT.CONTENT_TYPE_DEFAULT') || safe === t('COMMON.PLATFORM_WECHAT')) {
        return 'wechat_article';
      }
      return safe;
    }

    function displayContentType(rawType) {
      const safe = String(rawType || '').trim().toLowerCase();
      if (!safe || safe === 'wechat_article' || safe === t('CONTENT.CONTENT_TYPE_DEFAULT')) {
        return t('CONTENT.CONTENT_TYPE_DEFAULT');
      }
      return rawType;
    }

    function formatCreatedAt(raw) {
      const safe = String(raw || '').trim();
      if (!safe) return t('COMMON.NONE');
      return safe.replace('T', ' ').replace('+00:00', 'Z');
    }

    async function viewVersionDetail(versionId) {
      try {
        const payload = await TFUI.requestJSON(`/content/versions/${versionId}`);
        const version = payload.version || null;
        if (!version) {
          return;
        }
        const meta = version.meta || {};
        refs.previewHeadline.textContent = meta.headline || t('CONTENT.VERSION_TITLE_FALLBACK');
        refs.previewParagraph1.textContent = version.content_text || t('CONTENT.PREVIEW_NO_DRAFT');
        refs.previewParagraph2.textContent = Array.isArray(meta.structure)
          ? formatTemplate(t('CONTENT.PREVIEW_STRUCTURE_TEMPLATE'), { items: meta.structure.join(' / ') })
          : '';
        refs.previewInsight.textContent = t('CONTENT.VERSION_DETAIL_TITLE');
        setResult({ version });
      } catch (error) {
        setResult({ error: TFUI.normalizeErrorMessage(error), payload: error.payload || null });
      }
    }

    function renderVersions() {
      refs.versionBody.innerHTML = '';
      if (!versions.length) {
        TFUI.toggleHidden(refs.versionsTableWrap, true);
        TFUI.setState(refs.versionsState, 'empty', t('CONTENT.VERSIONS_EMPTY_TITLE'), t('CONTENT.VERSIONS_EMPTY_DESC'));
        return;
      }

      versions.forEach((version, index) => {
        const meta = version.meta || {};
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="tf-mono">${index + 1}</td>
          <td class="tf-mono">${TFUI.escapeHtml(version.topic_id)}</td>
          <td>${TFUI.escapeHtml(displayContentType(version.content_type))}</td>
          <td class="tf-mono">${TFUI.escapeHtml(formatCreatedAt(version.created_at))}</td>
          <td>${TFUI.escapeHtml(meta.headline || t('CONTENT.VERSION_TITLE_FALLBACK'))}</td>
          <td><button type="button" class="tf-button is-secondary" data-action="view">${TFUI.escapeHtml(t('ACTION.VIEW_DETAIL'))}</button></td>
        `;
        tr.querySelector('[data-action="view"]').addEventListener('click', () => viewVersionDetail(version.id));
        refs.versionBody.appendChild(tr);
      });

      TFUI.clearState(refs.versionsState);
      TFUI.toggleHidden(refs.versionsTableWrap, false);
    }

    function syncTopicSelection() {
      const topic = currentTopic();
      refs.topicId.value = topic ? String(topic.id) : '';
      updateSummary(topic);
      loadVersions(topic ? topic.id : null);
    }

    function populateTopicSelect() {
      refs.topicSelect.innerHTML = '';

      if (!topics.length) {
        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = t('CONTENT.TOPIC_SELECT_EMPTY');
        refs.topicSelect.appendChild(emptyOption);
        refs.topicId.value = '';
        updateSummary(null);
        return;
      }

      topics.forEach((topic) => {
        const option = document.createElement('option');
        option.value = String(topic.id);
        option.textContent = `${t('TOPICS.GUIDANCE_TOPIC_ID_TEMPLATE').replace('{id}', topic.id)} ${topic.topic_title || ''}`;
        refs.topicSelect.appendChild(option);
      });

      if (!topics.some((topic) => topic.id === selectedTopicId)) {
        selectedTopicId = topics[0].id;
      }
      refs.topicSelect.value = String(selectedTopicId);
      syncTopicSelection();
    }

    async function loadTopics() {
      try {
        const payload = await TFUI.requestJSON('/topics?limit=100');
        topics = payload.items || [];

        if (Number.isFinite(queryTopicId) && topics.some((topic) => topic.id === queryTopicId)) {
          selectedTopicId = queryTopicId;
        }

        populateTopicSelect();
      } catch (error) {
        setResult({ error: TFUI.normalizeErrorMessage(error), payload: error.payload || null });
      }
    }

    async function loadVersions(topicId = null) {
      TFUI.setState(refs.versionsState, 'loading', t('STATE.LOADING'), t('CONTENT.VERSIONS_LOADING_DESC'));
      TFUI.toggleHidden(refs.versionsTableWrap, true);
      refs.versionBody.innerHTML = '';

      try {
        const params = new URLSearchParams({ limit: '100' });
        if (Number.isFinite(topicId)) {
          params.set('topic_id', String(topicId));
        }
        const payload = await TFUI.requestJSON(`/content/versions?${params.toString()}`);
        versions = payload.items || [];
        renderVersions();
      } catch (error) {
        versions = [];
        TFUI.setState(refs.versionsState, 'error', t('STATE.READ_FAILED'), TFUI.normalizeErrorMessage(error), {
          actionLabel: t('ACTION.RETRY'),
          onAction: () => loadVersions(topicId),
        });
      }
    }

    async function generateContent(useLastInput = false) {
      refs.contentGenerate.disabled = true;
      refs.regenerateToolbar.disabled = true;
      refs.retryErrorTip.disabled = true;
      TFUI.setState(refs.outputState, 'loading', t('STATE.GENERATING'), t('CONTENT.GENERATING_DESC'));
      setErrorTip(false);

      try {
        let payloadInput;

        if (useLastInput && lastGenerateInput) {
          payloadInput = { ...lastGenerateInput };
        } else {
          const topicId = Number(refs.topicId.value.trim());
          if (!Number.isFinite(topicId)) {
            throw new Error(t('CONTENT.TOPIC_ID_INVALID'));
          }

          const contentType = normalizeContentType(refs.contentType.value.trim());
          const rawInput = refs.inputPayload.value.trim();
          const inputPayload = rawInput ? JSON.parse(rawInput) : {};

          payloadInput = {
            topic_id: topicId,
            content_type: contentType,
            input_payload: inputPayload,
          };
          lastGenerateInput = payloadInput;
        }

        const response = await TFUI.requestJSON('/content/generate', {
          method: 'POST',
          body: payloadInput,
        });

        const topic = topics.find((item) => item.id === Number(payloadInput.topic_id)) || null;
        updatePreview(response.result, topic);
        setResult(response);
        setOutputStatus(response.job && response.job.status ? response.job.status : 'completed');
        TFUI.clearState(refs.outputState);
        await loadVersions(Number(payloadInput.topic_id));
      } catch (error) {
        const errorText = TFUI.normalizeErrorMessage(error);
        setErrorTip(true, t('CONTENT.ERROR_TIP_TITLE'), errorText);
        setOutputStatus('failed');
        setResult({ error: errorText, payload: error.payload || null });
        TFUI.setState(refs.outputState, 'error', t('CONTENT.ERROR_TIP_TITLE'), errorText, {
          actionLabel: t('ACTION.RETRY'),
          onAction: () => generateContent(true),
        });
      } finally {
        refs.contentGenerate.disabled = false;
        refs.regenerateToolbar.disabled = false;
        refs.retryErrorTip.disabled = false;
      }
    }

    refs.topicSelect.addEventListener('change', () => {
      selectedTopicId = Number(refs.topicSelect.value);
      syncTopicSelection();
    });

    refs.topicId.addEventListener('change', () => {
      const value = Number(refs.topicId.value.trim());
      if (!Number.isFinite(value)) return;
      selectedTopicId = value;
      if (topics.some((item) => item.id === value)) {
        refs.topicSelect.value = String(value);
      }
      syncTopicSelection();
    });

    refs.contentGenerate.addEventListener('click', () => generateContent(false));
    refs.regenerateToolbar.addEventListener('click', () => generateContent(true));
    refs.retryErrorTip.addEventListener('click', () => generateContent(true));

    refs.contentClear.addEventListener('click', () => {
      refs.inputPayload.value = '';
      refs.contentType.value = t('CONTENT.CONTENT_TYPE_DEFAULT');
      setErrorTip(false);
      setOutputStatus(null);
      setResult({ message: t('CONTENT.RESULT_CLEAR_MESSAGE') });
      TFUI.clearState(refs.outputState);
      updatePreview(null, currentTopic());
    });

    refs.contentType.value = t('CONTENT.CONTENT_TYPE_DEFAULT');
    refs.errorTipTitle.textContent = t('CONTENT.ERROR_TIP_TITLE');
    refs.errorTipDesc.textContent = t('CONTENT.ERROR_TIP_DESC');
    setResult({ message: t('CONTENT.RESULT_WAIT_MESSAGE') });
    updatePreview(null, null);
    loadVersions(null);
    loadTopics();
  </script>
</body>
</html>
