<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="PAGE_TITLE.TOPICS"></title>
  <link rel="stylesheet" href="/web/assets/ui.css" />
</head>
<body class="tf-body">
  <div class="tf-app-shell">
    <aside class="tf-sidebar" data-region="sidebar">
      <div class="tf-brand">
        <h1 class="tf-brand-title" data-i18n="BRAND.ENTERPRISE"></h1>
        <p class="tf-brand-subtitle" data-i18n="BRAND.VERSION"></p>
      </div>
      <nav class="tf-nav" data-region="navigation">
        <a class="tf-nav-link" href="/web/discovery" data-i18n="NAV.DISCOVERY"></a>
        <a class="tf-nav-link is-active" href="/web/topics" data-i18n="NAV.TOPICS"></a>
        <a class="tf-nav-link" href="/web/content" data-i18n="NAV.CONTENT"></a>
        <span class="tf-nav-link tf-muted" data-i18n="NAV.IMAGE_LAB"></span>
        <span class="tf-nav-link tf-muted" data-i18n="NAV.QUALITY_GATE"></span>
        <span class="tf-nav-link tf-muted" data-i18n="NAV.RETROSPECTIVE"></span>
      </nav>
      <div class="tf-nav-tail">
        <span class="tf-nav-link tf-muted" data-i18n="NAV.HELP_CENTER"></span>
        <span class="tf-nav-link tf-muted" data-i18n="NAV.ACCOUNT"></span>
      </div>
    </aside>

    <div class="tf-main">
      <header class="tf-topbar" data-region="header">
        <h2 class="tf-topbar-title-sm" data-i18n="PAGE.TOPIC_POOL"></h2>
        <div class="tf-toolbar">
          <span class="tf-chip is-strong" data-i18n="TOPICS.TOOLBAR_ALL"></span>
          <span class="tf-chip" data-i18n="TOPICS.TOOLBAR_PINNED"></span>
          <span class="tf-chip" data-i18n="TOPICS.TOOLBAR_ARCHIVED"></span>
        </div>
      </header>

      <main class="tf-workspace" data-page="topics">
        <section id="topics-stats" class="tf-panel" data-slot="stats">
          <div class="tf-panel-body">
            <div class="tf-stats-grid">
              <div class="tf-stat">
                <div>
                  <div class="tf-stat-label" data-i18n="TOPICS.STAT_PENDING"></div>
                  <div class="tf-stat-value" id="stat-pending">0</div>
                </div>
                <span class="tf-status-badge is-pending" data-i18n="TOPICS.STAT_PENDING"></span>
              </div>
              <div class="tf-stat">
                <div>
                  <div class="tf-stat-label" data-i18n="TOPICS.STAT_PROCESSING"></div>
                  <div class="tf-stat-value" id="stat-processing">0</div>
                </div>
                <span class="tf-status-badge is-in_progress" data-i18n="TOPICS.STAT_PROCESSING"></span>
              </div>
              <div class="tf-stat">
                <div>
                  <div class="tf-stat-label" data-i18n="TOPICS.STAT_DONE"></div>
                  <div class="tf-stat-value" id="stat-done">0</div>
                </div>
                <span class="tf-status-badge is-done" data-i18n="TOPICS.STAT_DONE"></span>
              </div>
            </div>
          </div>
        </section>

        <section id="topics-list" class="tf-panel" data-slot="list">
          <div class="tf-panel-head">
            <div>
              <h3 class="tf-panel-title" data-i18n="MODULE.TOPIC_LIST"></h3>
              <p class="tf-panel-desc" data-i18n="TOPICS.LIST_DESC"></p>
            </div>
            <button id="topics-refresh" class="tf-button is-secondary" type="button" data-i18n="ACTION.REFRESH"></button>
          </div>
          <div class="tf-panel-body">
            <div id="topics-state" class="tf-state-host"></div>
            <div id="topics-table-wrap" class="tf-table-wrap is-hidden">
              <table class="tf-table">
                <thead>
                  <tr>
                    <th data-i18n="MODULE.TOPIC_LIST"></th>
                    <th data-i18n="FIELD.SIGNAL_REF"></th>
                    <th data-i18n="FIELD.SCORE"></th>
                    <th data-i18n="FIELD.PLATFORMS"></th>
                    <th data-i18n="FIELD.STATUS"></th>
                  </tr>
                </thead>
                <tbody id="topics-body"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section id="topics-guidance" data-slot="guidance">
          <div class="tf-guidance-panel">
            <div class="tf-guidance-head">
              <h3 class="tf-panel-title" style="margin: 0;" data-i18n="MODULE.TOPIC_ANGLE"></h3>
              <span class="tf-muted" id="guidance-topic-id">-</span>
            </div>
            <div class="tf-guidance-body">
              <div>
                <h4 class="tf-section-title" style="color: var(--tf-tertiary);" data-i18n="MODULE.STRATEGY_VIEW"></h4>
                <div id="guidance-angle" class="tf-angle-box" data-i18n="TOPICS.ANGLE_EMPTY"></div>
              </div>

              <div>
                <h4 class="tf-section-title" data-i18n="MODULE.HOOKS"></h4>
                <ol id="guidance-hooks" class="tf-note-list">
                  <li class="tf-muted" data-i18n="TOPICS.HOOKS_EMPTY"></li>
                </ol>
              </div>

              <div>
                <h4 class="tf-section-title" data-i18n="MODULE.PLATFORM_STRATEGY"></h4>
                <div id="guidance-platforms" class="tf-inline-tags">
                  <span class="tf-tag" data-i18n="TOPICS.PLATFORM_PENDING"></span>
                </div>
              </div>

              <div id="guidance-empty-ai" class="tf-empty-angle" data-i18n="TOPICS.ANGLE_EMPTY"></div>
            </div>

            <div class="tf-guidance-footer">
              <button id="topic-start" class="tf-button is-secondary" type="button" data-i18n="ACTION.START"></button>
              <button id="topic-complete" class="tf-button is-secondary" type="button" data-i18n="ACTION.COMPLETE"></button>
              <button id="topic-drop" class="tf-button is-secondary" type="button" data-i18n="ACTION.DROP"></button>
              <a id="start-writing" class="tf-button is-primary" href="/web/content" data-i18n="ACTION.START_WRITING"></a>
              <button id="edit-angle" class="tf-button is-secondary" type="button" data-i18n="ACTION.EDIT_ANGLE"></button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/web/assets/i18n_zh.js"></script>
  <script src="/web/assets/ui.js"></script>
  <script>
    TFUI.applyI18n(document);

    const refs = {
      topicsRefresh: document.getElementById('topics-refresh'),
      topicsState: document.getElementById('topics-state'),
      topicsTableWrap: document.getElementById('topics-table-wrap'),
      topicsBody: document.getElementById('topics-body'),
      statPending: document.getElementById('stat-pending'),
      statProcessing: document.getElementById('stat-processing'),
      statDone: document.getElementById('stat-done'),
      guidanceTopicId: document.getElementById('guidance-topic-id'),
      guidanceAngle: document.getElementById('guidance-angle'),
      guidanceHooks: document.getElementById('guidance-hooks'),
      guidancePlatforms: document.getElementById('guidance-platforms'),
      guidanceEmptyAi: document.getElementById('guidance-empty-ai'),
      topicStart: document.getElementById('topic-start'),
      topicComplete: document.getElementById('topic-complete'),
      topicDrop: document.getElementById('topic-drop'),
      startWriting: document.getElementById('start-writing'),
      editAngle: document.getElementById('edit-angle'),
    };

    const t = TFUI.t;
    const formatTemplate = TFUI.formatTemplate;

    let topics = [];
    let selectedTopicId = null;

    function currentTopic() {
      return topics.find((item) => item.id === selectedTopicId) || null;
    }

    function renderStats() {
      const pending = topics.filter((item) => item.status === 'pending').length;
      const processing = topics.filter((item) => item.status === 'in_progress').length;
      const done = topics.filter((item) => item.status === 'done').length;
      refs.statPending.textContent = String(pending);
      refs.statProcessing.textContent = String(processing);
      refs.statDone.textContent = String(done);
    }

    function buildHooks(topic) {
      const title = topic.topic_title || '';
      if (!title) {
        return [t('TOPICS.HOOK_FALLBACK')];
      }
      return [
        formatTemplate(t('TOPICS.HOOK_TEMPLATE_1'), { title }),
        formatTemplate(t('TOPICS.HOOK_TEMPLATE_2'), { title }),
      ];
    }

    function sourceTagLabel(raw) {
      const safe = String(raw || '').trim().toLowerCase();
      if (!safe || safe === 'general') {
        return t('COMMON.PLATFORM_GENERAL');
      }
      if (safe === 'wechat') {
        return t('COMMON.PLATFORM_WECHAT');
      }
      return raw;
    }

    function setTopicActionAvailability(topic) {
      if (!topic) {
        refs.topicStart.disabled = true;
        refs.topicComplete.disabled = true;
        refs.topicDrop.disabled = true;
        return;
      }

      const status = topic.status || 'pending';
      refs.topicStart.disabled = status !== 'pending';
      refs.topicComplete.disabled = status !== 'in_progress';
      refs.topicDrop.disabled = !(status === 'pending' || status === 'in_progress');
    }

    function setGuidance(topic) {
      if (!topic) {
        refs.guidanceTopicId.textContent = t('COMMON.NONE');
        refs.guidanceAngle.textContent = t('TOPICS.ANGLE_EMPTY');
        refs.guidanceHooks.innerHTML = `<li class="tf-muted">${TFUI.escapeHtml(t('TOPICS.HOOKS_EMPTY'))}</li>`;
        refs.guidancePlatforms.innerHTML = `<span class="tf-tag">${TFUI.escapeHtml(t('TOPICS.PLATFORM_PENDING'))}</span>`;
        refs.guidanceEmptyAi.classList.remove('is-hidden');
        refs.startWriting.href = '/web/content';
        setTopicActionAvailability(null);
        return;
      }

      refs.guidanceTopicId.textContent = formatTemplate(t('TOPICS.GUIDANCE_TOPIC_ID_TEMPLATE'), { id: topic.id });

      if (topic.angle && topic.angle.trim()) {
        refs.guidanceAngle.textContent = topic.angle;
        refs.guidanceEmptyAi.classList.add('is-hidden');
      } else {
        refs.guidanceAngle.textContent = t('TOPICS.ANGLE_EMPTY');
        refs.guidanceEmptyAi.classList.remove('is-hidden');
      }

      const hooks = buildHooks(topic);
      refs.guidanceHooks.innerHTML = hooks.map((hook) => `<li>${TFUI.escapeHtml(hook)}</li>`).join('');

      const platforms = (topic.target_platform || '').split(',').map((item) => item.trim()).filter(Boolean);
      refs.guidancePlatforms.innerHTML = platforms.length
        ? platforms.map((item) => TFUI.tagHtml(sourceTagLabel(item))).join('')
        : `<span class="tf-tag">${TFUI.escapeHtml(t('COMMON.PLATFORM_GENERAL'))}</span>`;

      refs.startWriting.href = `/web/content?topic_id=${topic.id}`;
      setTopicActionAvailability(topic);
    }

    function renderRows() {
      refs.topicsBody.innerHTML = '';
      topics.forEach((topic) => {
        const tr = document.createElement('tr');
        tr.className = topic.id === selectedTopicId ? 'tf-row-selected' : '';

        const business = Number(topic.commercial_value);
        const score = Number.isFinite(business) ? Math.max(0, Math.min(100, Math.round(business * 10))) : 0;
        const platformTags = (topic.target_platform || '').split(',').map((item) => item.trim()).filter(Boolean);

        tr.innerHTML = `
          <td>
            <div style="font-weight: 700;">${TFUI.escapeHtml(topic.topic_title || t('COMMON.NONE'))}</div>
            <div class="tf-muted" style="font-size: 12px;">${TFUI.escapeHtml(topic.signal_title || '')}</div>
          </td>
          <td class="tf-mono">${TFUI.escapeHtml(formatTemplate(t('TOPICS.SIGNAL_REF_TEMPLATE'), { id: topic.signal_id || t('COMMON.NONE') }))}</td>
          <td>
            <div style="display: flex; align-items: center; gap: 8px;">
              <strong>${score}</strong>
              <div style="width: 48px; height: 3px; background: #dbe3ef;">
                <div style="width: ${score}%; height: 3px; background: var(--tf-primary);"></div>
              </div>
            </div>
          </td>
          <td>${platformTags.length ? platformTags.map((item) => TFUI.tagHtml(sourceTagLabel(item))).join('') : `<span class="tf-tag">${TFUI.escapeHtml(t('COMMON.PLATFORM_GENERAL'))}</span>`}</td>
          <td>${TFUI.statusBadgeHtml(topic.status || 'pending', 'topic')}</td>
        `;

        tr.addEventListener('click', () => {
          selectedTopicId = topic.id;
          renderRows();
          setGuidance(topic);
        });

        refs.topicsBody.appendChild(tr);
      });
    }

    async function loadTopics() {
      TFUI.setState(refs.topicsState, 'loading', t('STATE.LOADING'), t('TOPICS.LOADING_DESC'));
      TFUI.toggleHidden(refs.topicsTableWrap, true);

      try {
        const payload = await TFUI.requestJSON('/topics?limit=100');
        topics = payload.items || [];
        renderStats();

        if (!topics.length) {
          refs.topicsBody.innerHTML = '';
          TFUI.setState(refs.topicsState, 'empty', t('TOPICS.EMPTY_TITLE'), t('TOPICS.EMPTY_DESC'), {
            actionLabel: t('ACTION.REFRESH'),
            onAction: () => loadTopics(),
          });
          selectedTopicId = null;
          setGuidance(null);
          return;
        }

        if (!topics.some((item) => item.id === selectedTopicId)) {
          selectedTopicId = topics[0].id;
        }

        renderRows();
        setGuidance(currentTopic());
        TFUI.clearState(refs.topicsState);
        TFUI.toggleHidden(refs.topicsTableWrap, false);
      } catch (error) {
        refs.topicsBody.innerHTML = '';
        TFUI.setState(refs.topicsState, 'error', t('STATE.READ_FAILED'), TFUI.normalizeErrorMessage(error), {
          actionLabel: t('ACTION.RETRY'),
          onAction: () => loadTopics(),
        });
      }
    }

    async function transitionTopic(action) {
      const topic = currentTopic();
      if (!topic) {
        return;
      }

      let endpoint = '';
      if (action === 'start') endpoint = 'start';
      if (action === 'complete') endpoint = 'complete';
      if (action === 'drop') endpoint = 'drop';
      if (!endpoint) return;

      try {
        const payload = await TFUI.requestJSON(`/topics/${topic.id}/${endpoint}`, {
          method: 'POST',
          body: {},
        });
        const updated = payload.topic || null;
        if (updated) {
          topics = topics.map((item) => (item.id === updated.id ? { ...item, ...updated } : item));
        }
        renderStats();
        renderRows();
        setGuidance(currentTopic());
        TFUI.clearState(refs.topicsState);
      } catch (error) {
        TFUI.setState(refs.topicsState, 'error', t('TOPICS.TRANSITION_NOT_ALLOWED'), TFUI.normalizeErrorMessage(error), {
          actionLabel: t('ACTION.RETRY'),
          onAction: () => transitionTopic(action),
        });
      }
    }

    refs.topicsRefresh.addEventListener('click', () => loadTopics());
    refs.topicStart.addEventListener('click', () => transitionTopic('start'));
    refs.topicComplete.addEventListener('click', () => transitionTopic('complete'));
    refs.topicDrop.addEventListener('click', () => transitionTopic('drop'));
    refs.editAngle.addEventListener('click', () => {
      const topic = currentTopic();
      if (!topic) {
        return;
      }
      TFUI.setState(refs.topicsState, 'empty', t('TOPICS.EDIT_PLACEHOLDER_TITLE'), t('TOPICS.EDIT_PLACEHOLDER_DESC'));
    });

    loadTopics();
  </script>
</body>
</html>
