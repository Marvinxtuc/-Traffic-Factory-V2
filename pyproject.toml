[project]
name = "traffic-factory"
version = "0.1.0"
description = "Phase 1 scaffold for the Traffic Factory project."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
