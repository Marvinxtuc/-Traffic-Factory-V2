name: current-main-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_release_rehearsal:
        description: "Run current-main release rehearsal in CI"
        required: false
        default: true
        type: boolean

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115.0" \
            "uvicorn>=0.30.0" \
            "requests>=2.32.0" \
            "beautifulsoup4>=4.12.0" \
            "feedparser>=6.0.11" \
            "httpx>=0.27.0"

      - name: Run unittest suite
        run: python -m unittest discover -s tests -p 'test_*.py'

  release-rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.run_release_rehearsal
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115.0" \
            "uvicorn>=0.30.0" \
            "requests>=2.32.0" \
            "beautifulsoup4>=4.12.0" \
            "feedparser>=6.0.11" \
            "httpx>=0.27.0"

      - name: Start current-main instance
        run: |
          mkdir -p logs
          cat > /tmp/traffic_factory_releasecheck.env <<'EOF'
          TF_HOST=127.0.0.1
          TF_PORT=8790
          TF_DB_PATH=data/runtime/traffic_factory_ci.sqlite3
          TF_LOG_LEVEL=INFO
          TF_ACCESS_LOG=false
          EOF
          TF_PORT=8790 TF_DB_PATH=data/runtime/traffic_factory_ci.sqlite3 TF_LOG_LEVEL=INFO TF_ACCESS_LOG=false bash scripts/restart_current_main.sh > logs/current-main-ci.log 2>&1 &
          echo $! > /tmp/current_main_wrapper.pid

      - name: Wait for current-main listener
        run: |
          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 8790), timeout=1):
                      print("listener ready")
                      raise SystemExit(0)
              except OSError:
                  time.sleep(1)
          raise SystemExit("current-main listener did not become ready in time")
          PY

      - name: Run release_check rehearsal
        run: |
          python scripts/release_check.py \
            --env-file /tmp/traffic_factory_releasecheck.env \
            --base-url http://127.0.0.1:8790 \
            --startup-log logs/current-main-ci.log

      - name: Upload startup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-ci-log
          path: logs/current-main-ci.log

      - name: Cleanup current-main process
        if: always()
        run: |
          if [ -f /tmp/current_main_wrapper.pid ]; then
            kill $(cat /tmp/current_main_wrapper.pid) 2>/dev/null || true
          fi
          listener_pid=$(lsof -tiTCP:8790 -sTCP:LISTEN || true)
          if [ -n "$listener_pid" ]; then
            kill $listener_pid 2>/dev/null || true
          fi
